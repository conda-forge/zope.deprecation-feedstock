{% set name = "zope.deprecation" %}
{% set version = "6.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/zope_deprecation-{{ version }}.tar.gz
  sha256: 4bdf09116a7a7d63743f829f6fddd6b407e5de256f650efa94bd1a397b478c86

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python

test:
  imports:
    - zope
    - zope.deprecation

about:
  home: https://github.com/zopefoundation/zope.deprecation
  license: ZPL 2.1
  license_family: OTHER
  license_file: LICENSE.txt
  summary: Zope Deprecation Infrastructure
  doc_url: https://zopedeprecation.readthedocs.io/
  dev_url: https://github.com/zopefoundation/zope.deprecation

extra:
  recipe-maintainers:
    - lincrosenbach
    - kfasolin
